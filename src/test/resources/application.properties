spring.application.name=proxymed-auth-test

# H2 en mode compatibilite PostgreSQL : les tests tournent sans Postgres.
# Le schema (Liquibase) et le mapping JPA restent identiques a la prod ; seul le
# moteur SQL change.
spring.datasource.url=jdbc:h2:mem:proxymed_auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Liquibase reste la seule source de verite du schema ; validate verifie que le mapping JPA
# correspond bien au changeset.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelogs/changelog-master.yaml

spring.jackson.deserialization.fail-on-unknown-properties=true

jwt.secret=secret-de-test-proxymed-auth-au-moins-32-octets-0123456789
jwt.expiration-secondes=3600
jwt.emetteur=proxymed-auth

proxymed.cors.origines=http://localhost:4200

# Serveur SMTP fictif : les tests ne doivent jamais envoyer de vrai email. Ceux qui declenchent
# un envoi remplacent EmailService par un mock (@MockitoBean).
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=expediteur@proxymed.test
