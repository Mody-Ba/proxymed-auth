spring.application.name=proxymed-auth

# Secrets (mot de passe de la base, secret du badge, premier administrateur) : jamais dans ce
# fichier. Ils viennent des variables d'environnement, ou du fichier local .env.properties a la
# racine du projet s'il existe (ignore par Git ; modele : .env.properties.example).
# Une vraie variable d'environnement l'emporte sur .env.properties.
spring.config.import=optional:file:./.env.properties

# 8081 : PROXYMED 1 (Fiche 1), 8082 : PROXYMED 2 (Fiche 2).
server.port=8083

# Base "proxymed_auth" sur le PostgreSQL local (meme serveur et meme role que les Fiches 1 et 2).
spring.datasource.url=jdbc:postgresql://localhost:5432/proxymed_auth
spring.datasource.username=${PROXYMED_DB_USERNAME:proxymed}
spring.datasource.password=${PROXYMED_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:db/changelogs/changelog-master.yaml

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.jackson.deserialization.fail-on-unknown-properties=true

# Badge (JWT) signe en HS256 : secret d'au moins 32 caracteres, sans valeur par defaut.
jwt.secret=${PROXYMED_JWT_SECRET}
jwt.expiration-secondes=${JWT_EXPIRATION_SECONDES:3600}
jwt.emetteur=proxymed-auth

# Premier administrateur : cree au demarrage par AdminInitializer s'il n'existe aucun compte ADMIN.
# L'email et le mot de passe viennent UNIQUEMENT de PROXYMED_ADMIN_EMAIL et PROXYMED_ADMIN_PASSWORD
# (variables d'environnement ou .env.properties) : ne jamais les ecrire dans ce fichier.

# Envoi des emails (code d'inscription) par SMTP avec STARTTLS. Aucune valeur ici : tout vient des
# variables PROXYMED_MAIL_* (environnement ou .env.properties). L'expediteur est PROXYMED_MAIL_USERNAME.
spring.mail.host=${PROXYMED_MAIL_HOST}
spring.mail.port=${PROXYMED_MAIL_PORT}
spring.mail.username=${PROXYMED_MAIL_USERNAME}
spring.mail.password=${PROXYMED_MAIL_PASSWORD}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
